name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (package.json engines) through current. The module
        # only shells out to xcodebuild on macOS, so the logic under test is
        # platform-independent and Linux runners are enough.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check # format + lint + typecheck + tests
